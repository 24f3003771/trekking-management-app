{% extends "base.html" %}
{% block title %}Staff Register - TrekApp{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm p-4 border-top border-primary border-4">
            <h3 class="text-center text-primary mb-4 fw-bold">Register as Staff</h3>
            <form action="{{ url_for('auth.register_staff') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold">Full Name</label>
                    <input type="text" class="form-control" name="name" required placeholder="e.g. Vikas Singh">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold">Email address</label>
                    <input type="email" class="form-control" name="email" required placeholder="vikas@staff.com">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold">Contact Details</label>
                    <input type="text" class="form-control" name="contact_details" required placeholder="Phone number or address">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold">Password</label>
                    <input type="password" class="form-control" name="password" required placeholder="Create a secure password">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Submit Application</button>
            </form>
            <div class="text-center mt-4">
                <p class="text-muted">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
