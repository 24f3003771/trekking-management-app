{% extends "base.html" %}
{% block title %}Register - TrekApp{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm p-4">
            <h3 class="text-center text-primary mb-4 fw-bold">Register</h3>
            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold">Full Name</label>
                    <input type="text" class="form-control" name="name" required placeholder="John Doe">
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold">Email address</label>
                    <input type="email" class="form-control" name="email" required placeholder="john@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary fw-semibold">Password</label>
                    <input type="password" class="form-control" name="password" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Register</button>
            </form>
            <div class="text-center mt-4">
                <p class="text-muted">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-semibold">Login here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
