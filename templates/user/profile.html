{% extends "base.html" %}
{% block title %}My Profile - TrekApp{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 mt-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom text-center">
                <h4 class="mb-0 text-primary fw-bold">My Profile</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('user.user_profile') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-medium text-dark">Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium text-dark">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium text-dark">New Password <small class="text-muted">(leave blank to keep current)</small></label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter new password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Update Profile</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
